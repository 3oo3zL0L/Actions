<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Droplet · STEERCO collector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Droplet · STEERCO collector (6 Oct 2026)
   Three ways to keep STEERCO small and always reachable,
   on top of Layout B (Today | Waiting on | Later | Week):
   A  Header tray next to Ask Claude, opens as a popover
   B  Slim strip at the foot of the Later lane, grows in place
   C  Corner folder tab, opens as a side sheet
   Each in three states: closed, dragging a card, open.
   Tokens and HUD language from layouts.html; lilac = STEERCO.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #0e1013; --bg-2: #121519; --surface: #15181c; --surface-2: #1a1e23; --raised: #1d2127; --bar: #252a31;
  --ink: #e9e6df; --muted: #9ba1a8; --faint: #4c535b;
  --line: #262b31; --line-2: #343a42; --line-3: #4a515a;
  --accent: #ff8a1f; --accent-hi: #ff9d3f; --accent-ink: #140a01; --accent-soft: rgba(255,138,31,.10); --accent-line: rgba(255,138,31,.6);
  --focus: #ffb36b;
  --ok: #9fd7a5; --ok-soft: rgba(159,215,165,.10); --ok-line: rgba(159,215,165,.45);
  --hold: #8db4d4; --hold-soft: rgba(141,180,212,.09); --hold-line: rgba(141,180,212,.45);
  --steer: #c3a9e3; --steer-soft: rgba(195,169,227,.09); --steer-mid: rgba(195,169,227,.16); --steer-line: rgba(195,169,227,.45);
  --f-display: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-meta: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --tap: 40px;
}
@media (pointer: coarse), (max-width: 959.98px) { :root { --tap: 44px; } }

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: left; }
ul, ol { list-style: none; margin: 0; padding: 0; }
svg { display: block; flex: none; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.kbd { display: none; font-family: var(--f-meta); font-size: 10.5px; line-height: 16px; min-width: 18px; padding: 0 4px; text-align: center; color: var(--muted); border: 1px solid var(--line-2); text-transform: none; letter-spacing: 0; }
@media (min-width: 960px) and (pointer: fine) { .kbd { display: inline-block; } }
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 32px 32px; -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%); mask-image: linear-gradient(to bottom, #000, transparent 85%); }

/* ---------- Mockup chrome (not part of the app) ---------- */
.mk { position: relative; z-index: 80; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 6px 16px; background: #08090b; border-bottom: 1px dashed var(--line-2); }
.mk-tag { font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mk-tag b { color: var(--ink); font-weight: 500; }
.mk-tabs { display: flex; gap: 2px; }
.mk-tab { min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-meta); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid transparent; }
.mk-tab b { font-family: var(--f-display); font-size: 15px; color: var(--ink); font-weight: 600; }
.mk-tab:hover { color: var(--ink); background: var(--surface); }
.mk-tab[aria-selected="true"] { color: var(--ink); background: var(--bar); border-color: var(--line-3); }
.mk-tab.rec::after { content: "Pick"; font-size: 9.5px; color: var(--steer); border: 1px solid var(--steer-line); padding: 0 4px; line-height: 14px; }
.mk-sep { width: 1px; height: 22px; background: var(--line-2); }
.mk-why { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 959.98px) {
  .mk { padding: 6px 12px 8px; }
  .mk-tabs { width: 100%; }
  .mk-tab { flex: 1; justify-content: center; min-height: 40px; padding: 0 4px; font-size: 10.5px; }
  .mk-sep { display: none; }
  .mk-why { flex-basis: 100%; white-space: normal; font-size: 12px; line-height: 1.4; }
}

/* ---------- Board (Layout B, simplified) ---------- */
.dir { position: relative; padding: 0 16px; }
.hd { display: flex; align-items: center; gap: 10px 16px; padding: 12px 0 8px; position: relative; z-index: 40; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; letter-spacing: .24em; text-transform: uppercase; font-size: 14px; }
.mark { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--accent); border-radius: 50%; color: var(--accent); }
.status { display: flex; flex-wrap: wrap; gap: 2px 12px; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
.hd-sp { flex: 1; }
.askbtn { min-height: var(--tap); display: inline-flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line-2); font-family: var(--f-meta); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.askbtn .ico { color: var(--accent); width: 16px; height: 16px; }
.askbtn .lbl::after { content: "_"; color: var(--accent); margin-left: 2px; }
.askbtn .hint { color: var(--faint); text-transform: none; letter-spacing: 0; font-size: 12px; }
.titlerow { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding-bottom: 10px; }
.h1 { margin: 0; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 26px; line-height: 1.1; }
.date, .sub { font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sub b { color: var(--ink); font-weight: 500; }
.tally { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px 0 8px; border: 1px solid var(--line-2); background: var(--surface); font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.tally .ico { color: var(--ok); width: 14px; height: 14px; }
.tally b { font-family: var(--f-display); font-size: 17px; font-weight: 600; color: var(--ink); }

.lanes { display: grid; gap: 12px; }
.lane { --lc: var(--faint); position: relative; min-width: 0; display: flex; flex-direction: column; background: rgba(21,24,28,.55); border: 1px solid var(--line); }
.lane::before { content: ""; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 2px solid var(--lc); border-left: 2px solid var(--lc); pointer-events: none; z-index: 2; }
.lane.go { --lc: var(--accent); } .lane.wait { --lc: var(--hold); } .lane.week { --lc: var(--ok); }
.lane-h { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lane-h b { color: var(--ink); font-weight: 500; font-size: 12px; }
.lane.go .lane-h b { color: var(--accent-hi); } .lane.wait .lane-h b { color: var(--hold); } .lane.week .lane-h b { color: var(--ok); }
.lane-h .n { color: var(--faint); }
.lane-h .r { margin-left: auto; white-space: nowrap; }
.lane-b { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.add { display: flex; gap: 0; }
.add input { flex: 1; min-width: 0; min-height: var(--tap); padding: 0 12px; background: var(--bg-2); border: 1px solid var(--line-2); border-right: 0; border-radius: 0; font-size: 14.5px; }
.add input::placeholder { color: var(--faint); }
.add button { min-height: var(--tap); padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--f-meta); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
.bc { position: relative; display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); }
.bc-o { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; }
.meta { display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; }
.meta .ico { width: 14px; height: 14px; }
.meta span { overflow: hidden; text-overflow: ellipsis; }
.bc-t { font-size: 14.5px; line-height: 1.3; font-weight: 500; }
.bc-w { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd { align-self: flex-start; font-family: var(--f-meta); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-hi); }
.cmd.first { background: var(--accent); color: var(--accent-ink); padding: 3px 8px; margin-top: 2px; }
.bc.first::before { content: ""; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
.dn { flex: none; width: var(--tap); display: grid; place-items: center; color: var(--muted); border-left: 1px solid var(--line); }
.dn .ico { width: 16px; height: 16px; }
.bc.w::after, .bc.e::after { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; }
.bc.w::after { background: var(--hold-line); }
.bc.e { background: var(--bg-2); border-style: dashed; border-color: var(--line-2); }
.bc.e::after { background: repeating-linear-gradient(180deg, var(--hold) 0 6px, transparent 6px 10px); }
.bc.w .bc-t, .bc.e .bc-t { font-weight: 400; font-size: 14px; }
.st { align-self: flex-start; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--hold); border: 1px solid var(--hold-line); padding: 0 6px; line-height: 18px; }
.st.d { border-style: dashed; }
.subl { display: flex; align-items: center; gap: 8px; margin: 6px 4px 0; font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.subl b { color: var(--hold); font-weight: 500; } .subl .n { color: var(--faint); }
.subl::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.row { display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; }
.row .ico { width: 15px; height: 15px; color: var(--muted); }
.row span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
.fold { display: flex; align-items: center; gap: 8px; min-height: var(--tap); padding: 0 6px; margin-top: 4px; border-top: 1px solid var(--line); font-family: var(--f-meta); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fold b { color: var(--ink); font-weight: 500; } .fold .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.fold .ico { width: 16px; height: 16px; }
.wk { padding: 10px; border: 1px solid var(--line); background: var(--surface); box-shadow: inset 3px 0 0 var(--ok-line); font-family: var(--f-meta); }
.wk-h { display: flex; align-items: baseline; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ok); }
.wk-h b { margin-left: auto; font-family: var(--f-display); font-size: 18px; color: var(--ink); font-weight: 600; }
.hbar { display: flex; height: 8px; margin-top: 6px; gap: 1px; background: var(--bg-2); border: 1px solid var(--line); }
.hbar span { height: 100%; }
.dropok { color: var(--ok); }

@media (min-width: 960px) {
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .dir { height: 100%; display: flex; flex-direction: column; padding: 0 20px 14px; }
  .lanes { flex: 1; min-height: 0; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.9fr); }
  .lane { min-height: 0; }
  .lane-b { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
}

/* ---------- Drag (shared) ---------- */
.is-drag .bc.src { opacity: .35; outline: 1px dashed var(--line-3); outline-offset: -1px; }
.is-drag .lane.droppable { border-style: dashed; border-color: var(--line-2); }
.ghost { position: fixed; z-index: 90; width: 300px; pointer-events: none; transform: rotate(-2deg); box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 1px var(--accent-line); background: var(--raised); }
.ghost .bc { border-color: var(--accent-line); background: var(--raised); }
.cursor { position: absolute; right: -10px; bottom: -14px; width: 22px; height: 22px; color: var(--ink); filter: drop-shadow(0 1px 2px #000); }
.cursor .ico { width: 22px; height: 22px; fill: var(--ink); stroke: #000; stroke-width: 1; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px var(--steer-soft); } 50% { box-shadow: 0 0 0 7px var(--steer-soft); } }

/* ---------- STEERCO list (shared by all three when open) ---------- */
.sp { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--bg-2); border: 1px solid var(--steer-line); box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.sp::before, .sp::after { content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; z-index: 3; }
.sp::before { top: -2px; left: -2px; border-top: 2px solid var(--steer); border-left: 2px solid var(--steer); }
.sp::after { bottom: -2px; right: -2px; border-bottom: 2px solid var(--steer); border-right: 2px solid var(--steer); }
.sp-h { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 4px 0 14px; border-bottom: 1px solid var(--line); background: var(--surface); font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sp-h b { color: var(--steer); font-weight: 500; font-size: 12.5px; }
.sp-h .n { color: var(--ink); }
.sp-h .nx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sp-h .sp-sp { flex: 1; }
.ibtn { flex: none; min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-family: var(--f-meta); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.ibtn .ico { width: 15px; height: 15px; }
.ibtn:hover { color: var(--ink); background: var(--surface-2); }
.ibtn.copy { color: var(--steer); border: 1px solid var(--steer-line); min-height: 34px; margin-right: 4px; }
.ibtn.copy:hover { background: var(--steer-soft); }
.sp-add { display: flex; padding: 10px 12px 8px; gap: 0; }
.sp-add input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; background: var(--bg); border: 1px dashed var(--steer-line); border-right: 0; border-radius: 0; font-size: 15px; }
.sp-add input::placeholder { color: var(--faint); }
.sp-add input:focus { outline: 2px solid var(--steer); outline-offset: -2px; border-style: solid; }
.sp-add button { min-height: 44px; padding: 0 14px; border: 1px solid var(--steer-line); color: var(--steer); font-family: var(--f-meta); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.sp-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.sp-list { display: flex; flex-direction: column; gap: 6px; }
.si { position: relative; background: var(--surface); border: 1px solid var(--line); }
.si::before { content: ""; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 3px; background: var(--steer); }
.si.is-new { animation: arrive .6s ease-out; border-color: var(--steer-line); }
@keyframes arrive { from { background: var(--steer-mid); } to { background: var(--surface); } }
.si-top { display: grid; grid-template-columns: 26px minmax(0,1fr) 28px; gap: 0 6px; padding: 8px 4px 2px 12px; }
.si-n { font-family: var(--f-meta); font-size: 11.5px; color: var(--steer); padding-top: 1px; }
.si-b { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.si-t { font-size: 14px; line-height: 1.3; font-weight: 500; }
.grip { color: var(--faint); display: grid; place-items: start center; padding-top: 2px; cursor: grab; }
.grip .ico { width: 14px; height: 14px; }
.si-note { display: block; width: calc(100% - 50px); margin: 4px 8px 0 44px; min-height: 32px; resize: none; padding: 5px 8px; border-radius: 0; background: var(--bg-2); border: 1px dashed var(--line-2); font-size: 13.5px; line-height: 1.4; color: var(--ink); }
.si-note::placeholder { color: var(--faint); font-style: italic; }
.si-note.has { background: transparent; border-color: transparent; color: var(--muted); padding-left: 0; }
.si-note { overflow: hidden; }
.si-act { display: flex; justify-content: flex-end; margin-top: 0; }
.si-act .ibtn { min-height: 32px; font-size: 10.5px; }
@media (pointer: coarse), (max-width: 959.98px) { .si-act .ibtn { min-height: 44px; flex: 1; } }
.si-act .ibtn.ok:hover { color: var(--ok); background: var(--ok-soft); }
.si-act .ibtn.ask .ico { color: var(--accent); }
.sp-sec { display: flex; align-items: center; gap: 8px; margin: 14px 2px 6px; font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sp-sec b { color: var(--steer); font-weight: 500; } .sp-sec .n { color: var(--faint); }
.sp-sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.sg { display: flex; flex-direction: column; gap: 2px; padding: 8px 4px 0 12px; border: 1px dashed var(--line-2); background: transparent; }
.sg + .sg { margin-top: 6px; }
.sg-t { font-size: 13.5px; line-height: 1.35; }
.sg-f { font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.sg-f .ico { width: 13px; height: 13px; }
.sg-a { display: flex; justify-content: flex-end; }
.sg-a .ibtn { min-height: 36px; font-size: 10.5px; }
.sg-a .ibtn.add2 { color: var(--steer); }
@media (pointer: coarse), (max-width: 959.98px) { .sg-a .ibtn { min-height: 44px; } }
.sp-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 14px; border-top: 1px dashed var(--line); font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.sp-foot span { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 959.98px), (pointer: coarse) { .sp-foot { display: none; } }
.sp-drop { display: none; margin: 0 12px 8px; min-height: 36px; border: 1px dashed var(--steer-line); background: var(--steer-soft); color: var(--steer); font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; align-items: center; justify-content: center; gap: 8px; }

/* ============================================================
   A · Header tray
   ============================================================ */
.tray { position: relative; display: flex; align-items: stretch; min-height: var(--tap); border: 1px solid var(--steer-line); background: var(--surface); }
.tray::before, .tray::after { content: ""; position: absolute; width: 8px; height: 8px; pointer-events: none; }
.tray::before { top: -2px; left: -2px; border-top: 2px solid var(--steer); border-left: 2px solid var(--steer); }
.tray::after { bottom: -2px; right: -2px; border-bottom: 2px solid var(--steer); border-right: 2px solid var(--steer); }
.tray-o { display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; font-family: var(--f-meta); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--steer); border-right: 1px solid var(--line-2); white-space: nowrap; }
.tray-o .ico { width: 16px; height: 16px; }
.tray-o .n { color: var(--ink); }
.tray-o .chev { width: 14px; height: 14px; color: var(--muted); transition: transform .2s; }
.tray-o:hover { background: var(--steer-soft); }
.tray-o[aria-expanded="true"] { background: var(--steer-soft); }

      '<div class="titlerow"><h1 class="h1">Today</h1><span class="date">Tue 06 Oct 2026 · 10:00</span><span class="tally">' + ico('check') + '<b>02</b> done today</span><span class="sub"><b>5</b> open · 3 deferred</span></div>' +
      '<div class="lanes">' +
        '<section class="lane go"><div class="lane-h"><b>Today</b><span class="n">5</span><span class="r">Your move</span></div><div class="lane-b">' +
          '<form class="add" onsubmit="return false"><label class="sr" for="addT">New action</label><input id="addT" placeholder="What needs doing?"><button>Add</button></form>' +
          '<ul style="display:flex;flex-direction:column;gap:6px">' + TODAY.map(card).join('') + '</ul></div></section>' +
        '<section class="lane wait droppable"><div class="lane-h"><b>Waiting on</b><span class="n">2</span><span class="r">+ elsewhere 1</span></div><div class="lane-b">' +
          '<ul style="display:flex;flex-direction:column;gap:6px">' + WAIT.map(function (w) { return wcard(w); }).join('') + '</ul>' +
          '<div class="subl"><b>Elsewhere</b><span class="n">1</span></div><ul>' + ELSE.map(function (w) { return wcard(w, true); }).join('') + '</ul></div></section>' +
        '<section class="lane later droppable"><div class="lane-h"><b>Later</b><span class="n">2</span><span class="r">Out of Today</span></div><div class="lane-b">' +
          LATER.map(function (r) { return '<div class="row">' + ico(r.src) + '<span>' + esc(r.t) + '</span></div>'; }).join('') +
          '<div class="fold"><b>Everything else</b><span class="n" style="color:var(--faint)">14</span><span class="r"><span class="kbd">/</span>' + ico('chev') + '</span></div></div>' +
          (d === 'b' ? stripB() + (S.st === 'open' ? steerList('b') : '<section class="sp"></section>') : '') + '</section>' +
        '<section class="lane week droppable"><div class="lane-h"><b>Week</b><span class="r">Week 41</span></div><div class="lane-b">' +
          '<div class="wk"><div class="wk-h">Hours<b>14.5<small style="font-family:var(--f-meta);font-size:11px;color:var(--faint);font-weight:400"> / 40</small></b></div><div class="hbar"><span style="width:30%;background:var(--accent)"></span><span style="width:12%;background:var(--hold)"></span><span style="width:8%;background:var(--steer)"></span></div></div>' +
          '<div class="fold">' + ico('check', 'dropok') + '<b>Recently done</b><span class="n" style="color:var(--faint)">6</span><span class="r">7 days ' + ico('chev') + '</span></div></div></section>' +
      '</div>' +
      (d === 'c' ? folderC() : '') +
      '<div class="askbar"><button class="askbtn">' + ico('spark') + '<span class="lbl">Ask Claude</span><span class="hint">Update a page…</span></button></div>' +
    '</div>' +
    (S.st === 'drag' ? '<div class="ghost" id="ghost" aria-hidden="true"><ul>' + card(Object.assign({}, TODAY[1], { drag: false })) + '</ul><span class="cursor">' + '<svg class="ico" viewBox="0 0 24 24">' + P.ptr + '</svg></span></div>' : '');
    document.getElementById('stage').innerHTML = html;
    document.querySelectorAll('[data-dir]').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.dir === S.dir)); });
    document.querySelectorAll('[data-st]').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.st === S.st)); });
    document.getElementById('mkWhy').textContent = WHY[S.dir];
    if (S.st === 'drag') requestAnimationFrame(placeGhost);
    document.querySelectorAll('.si-note').forEach(function (t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; });
    if (S.st === 'open') { var inp = document.querySelector(S.dir === 'a' && !matchMedia('(max-width: 959.98px)').matches ? '#trayIn' : '.sp-add input'); if (inp && !matchMedia('(max-width: 959.98px)').matches) inp.focus({ preventScroll: true }); }
  }
  function placeGhost() {
    var g = document.getElementById('ghost');
    var phone = matchMedia('(max-width: 959.98px)').matches;
    var tgt = document.querySelector(S.dir === 'a' ? '.pocket' : S.dir === 'b' ? '.strip-drop' : '.pad');
    if (!g || !tgt) return;
    var r = tgt.getBoundingClientRect(), gw = g.offsetWidth;
    var left = phone ? Math.max(8, r.left + 40) : Math.max(8, r.left - gw * 0.78);
    var top = phone ? r.top + r.height * 0.72 : r.top + r.height * 0.72;
    top = Math.min(top, window.innerHeight - g.offsetHeight - 24);
    if (S.dir === 'c' && !phone) left = r.left - gw * 0.85;
    g.style.left = left + 'px'; g.style.top = top + 'px';
  }
  function setHash() { history.replaceState(null, '', '#' + S.dir + (S.st === 'closed' ? '' : '-' + S.st)); }
  function fromHash() {
    var h = (location.hash || '#a').slice(1).split('-');
    S.dir = /^[abc]$/.test(h[0]) ? h[0] : 'a';
    S.st = /^(drag|open)$/.test(h[1]) ? h[1] : 'closed';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-dir],[data-st],[data-toggle],[data-close]');
    if (!t) { if (S.st === 'open' && S.dir === 'a' && !e.target.closest('.tray-wrap')) { S.st = 'closed'; setHash(); render(); } return; }
    if (t.dataset.dir) S.dir = t.dataset.dir;
    else if (t.dataset.st) S.st = t.dataset.st;
    else if (t.hasAttribute('data-toggle')) S.st = S.st === 'open' ? 'closed' : 'open';
    else if (t.hasAttribute('data-close')) S.st = 'closed';
    setHash(); render();
  });
  document.addEventListener('keydown', function (e) {
    var typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === 'Escape' && S.st !== 'closed') { S.st = 'closed'; setHash(); render(); return; }
    if (typing) {
      if (e.key === 'Enter' && document.activeElement.matches('#trayIn, #stripIn, .sp-add input') && document.activeElement.value.trim()) {
        STEER.unshift({ kind: 'point', t: document.activeElement.value.trim(), note: '' }); render();
      }
      return;
    }
    if (e.key === 's') { e.preventDefault(); var f = document.querySelector('#trayIn, #stripIn'); if (f && getComputedStyle(f.closest('form')).display !== 'none') f.focus(); else { S.st = 'open'; setHash(); render(); } }
    if (e.key === 'S') { S.st = 'open'; setHash(); render(); }
  });
  document.addEventListener('input', function (e) { var t = e.target; if (t.classList && t.classList.contains('si-note')) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; } });
  window.addEventListener('resize', function () { if (S.st === 'drag') placeGhost(); });
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  fromHash(); render();
})();
</script>
</body>
</html>
