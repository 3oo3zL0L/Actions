<title>Droplet · Layouts</title>
<style>
/* ============================================================
   Droplet · Layouts (on top of Lambda v3 + States)
   Three ways to use a laptop screen for an overview in one go,
   with no permanent "Standing by" panel:
   A  Dense list + slide-in panel
   B  Board: lanes, item as a drawer over the right lanes
   C  Today-first split: Today large left, live overview right
   Same data, same states vocabulary in all three:
   orange = act now, steel = elsewhere / waiting, green = done.
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #0e1013;
  --bg-2: #121519;
  --surface: #15181c;
  --surface-2: #1a1e23;
  --raised: #1d2127;
  --bar: #252a31;
  --ink: #e9e6df;
  --muted: #9ba1a8;
  --faint: #4c535b;
  --line: #262b31;
  --line-2: #343a42;
  --line-3: #4a515a;
  --accent: #ff8a1f;
  --accent-hi: #ff9d3f;
  --accent-ink: #140a01;
  --accent-soft: rgba(255, 138, 31, 0.10);
  --accent-line: rgba(255, 138, 31, 0.6);
  --focus: #ffb36b;
  --ok: #9fd7a5;
  --ok-soft: rgba(159, 215, 165, 0.10);
  --ok-line: rgba(159, 215, 165, 0.45);
  --hold: #8db4d4;
  --hold-soft: rgba(141, 180, 212, 0.09);
  --hold-line: rgba(141, 180, 212, 0.45);
  --f-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-meta: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --tap: 40px;
  --rowh: 34px;
}
@media (pointer: coarse) { :root { --tap: 44px; --rowh: 44px; } }
@media (max-width: 959.98px) { :root { --tap: 44px; --rowh: 44px; } }

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; border-radius: 0; text-align: left; }
ul, ol { list-style: none; margin: 0; padding: 0; }
svg { display: block; flex: none; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 14px; height: 14px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.kbd {
  display: none; font-family: var(--f-meta); font-size: 10.5px; line-height: 16px; min-width: 18px; padding: 0 4px;
  text-align: center; color: var(--muted); border: 1px solid var(--line-2); text-transform: none; letter-spacing: 0; font-style: normal;
}
@media (min-width: 960px) and (pointer: fine) { .kbd { display: inline-block; } }
.sky {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%); mask-image: linear-gradient(to bottom, #000, transparent 85%);
}

/* ---------- Mockup chrome (not part of the app) ---------- */
.mk {
  position: relative; z-index: 60; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap;
  padding: 6px 16px; background: #08090b; border-bottom: 1px dashed var(--line-2);
}
.mk-tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.mk-tag b { color: var(--ink); font-weight: 500; }
.mk-tag i { font-style: normal; border: 1px dashed var(--line-3); padding: 0 5px; line-height: 16px; color: var(--faint); }
.mk-tabs { display: flex; gap: 2px; }
.mk-tab {
  min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--f-meta); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid transparent;
}
.mk-tab b { font-family: var(--f-display); font-size: 15px; color: var(--ink); font-weight: 600; }
.mk-tab:hover { color: var(--ink); background: var(--surface); }
.mk-tab[aria-selected="true"] { color: var(--ink); background: var(--bar); border-color: var(--line-3); }
.mk-why { margin: 0; flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 959.98px) {
  .mk { padding: 6px 12px 8px; }
  .mk-tabs { width: 100%; }
  .mk-tab { flex: 1; justify-content: center; min-height: 44px; padding: 0 6px; font-size: 11px; }
  .mk-why { flex-basis: 100%; white-space: normal; font-size: 12.5px; line-height: 1.4; }
}

/* ---------- Stage: one direction at a time ---------- */
@media (min-width: 960px) {
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .dir { height: 100%; }
  .scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
}

/* ---------- Shared: header ---------- */
.hd { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding: 12px 0 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 600; letter-spacing: .24em; text-transform: uppercase; font-size: 14px; }
.mark { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--accent); border-radius: 50%; color: var(--accent); }
.status { display: flex; flex-wrap: wrap; gap: 2px 12px; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 5px; vertical-align: 1px; }
.hd-sp { flex: 1; }
.askbtn {
  min-height: var(--tap); display: inline-flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--line-2); font-family: var(--f-meta); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink);
}
.askbtn .ico { color: var(--accent); width: 16px; height: 16px; }
.askbtn .lbl::after { content: "_"; color: var(--accent); margin-left: 2px; }
.askbtn .hint { color: var(--faint); text-transform: none; letter-spacing: 0; font-size: 12px; }
.askbtn:hover { border-color: var(--accent-line); }
.tally {
  display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px 0 8px;
  border: 1px solid var(--line-2); background: var(--surface);
  font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
}
.tally .ico { color: var(--ok); width: 14px; height: 14px; }
.tally b { font-family: var(--f-display); font-size: 17px; font-weight: 600; color: var(--ink); }
.tally.bump { border-color: var(--ok-line); } .tally.bump b { color: var(--ok); }
.titlerow { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }
.h1 { margin: 0; font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 26px; line-height: 1.1; }
.date { font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 0; color: var(--muted); font-family: var(--f-meta); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.sub b { color: var(--ink); font-weight: 500; } .sub .h { color: var(--hold); }
.askbar-ph { display: none; }
@media (max-width: 959.98px) {
  .hd .status, .hd .askbtn, .hd .date-d { display: none; }
  .askbar-ph {
    display: block; position: sticky; bottom: 0; z-index: 20; margin: 16px -16px 0; padding: 8px 16px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(14,16,19,0), var(--bg) 30%);
  }
  .askbar-ph .askbtn { width: 100%; min-height: 52px; padding: 0 16px; }
  .askbar-ph .hint { margin-left: auto; }
}

/* ---------- Shared: chips, flags, icons ---------- */
.flag { display: inline-block; font-family: var(--f-meta); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-hi); border: 1px solid var(--accent-line); padding: 0 5px; line-height: 16px; white-space: nowrap; }
.flag.pin { color: var(--ink); border-color: var(--line-3); }
.st {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; line-height: 18px; min-height: 20px;
  font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; border: 1px solid currentColor; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.st .ico { width: 12px; height: 12px; stroke-width: 1.8; }
.st-hold { color: var(--hold); background: var(--hold-soft); border-color: var(--hold-line); }
.st-wait { color: var(--hold); border-style: dashed; border-color: var(--hold-line); }
.sic { color: var(--muted); }
.sic .ico { width: 16px; height: 16px; }
.is-move .sic { color: var(--ink); }
.proj { font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.secl {
  display: flex; align-items: center; gap: 8px; font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.secl b { color: var(--ink); font-weight: 500; }
.secl .n { color: var(--faint); }
.secl.go b { color: var(--accent-hi); }
.secl.hold b { color: var(--hold); }
.secl::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.secl .r { order: 2; }

/* Done square: quiet, never orange. */
.dn {
  flex: none; width: var(--tap); min-height: var(--tap); display: grid; place-items: center; color: var(--muted); border-left: 1px solid var(--line);
}
.dn:hover { color: var(--ok); background: var(--ok-soft); }
.dn .ico { width: 16px; height: 16px; }

/* Add action */
.add { position: relative; display: flex; gap: 8px; align-items: center; }
.add label { font-family: var(--f-meta); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-hi); white-space: nowrap; }
.add input {
  flex: 1; min-width: 0; min-height: var(--tap); padding: 0 12px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 0; font-size: 15px;
}
.add input::placeholder { color: var(--faint); }
.add input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.add-btn {
  min-height: var(--tap); padding: 0 16px; background: var(--surface-2); border: 1px solid var(--line-3); color: var(--ink);
  font-family: var(--f-meta); font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
}
.add-btn:hover { border-color: var(--accent-line); color: var(--accent-hi); }

/* Search */
.srch { position: relative; flex: 1; min-width: 0; max-width: 260px; }
.srch .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 14px; height: 14px; pointer-events: none; }
.srch input { width: 100%; min-height: 30px; padding: 0 8px 0 28px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 0; font-size: 13px; }
.srch input::placeholder { color: var(--faint); }
@media (max-width: 959.98px) { .srch { max-width: none; } .srch input { min-height: 44px; font-size: 16px; } }

/* Hours recap */
.hrs { font-family: var(--f-meta); }
.hrs-h { display: flex; align-items: baseline; gap: 10px; }
.hrs-h .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hrs-h .tot { white-space: nowrap; margin-left: auto; font-family: var(--f-display); font-size: 18px; font-weight: 600; color: var(--ink); }
.hrs-h .tot small { font-family: var(--f-meta); font-size: 11px; color: var(--faint); font-weight: 400; margin-left: 4px; }
.hbar { display: flex; height: 8px; margin: 6px 0 0; background: var(--bg-2); border: 1px solid var(--line); gap: 1px; }
.hbar span { display: block; height: 100%; }
.hleg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 14px; margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: .03em; }
.hleg li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.hleg i { width: 8px; height: 8px; flex: none; }
.hleg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hleg .v { margin-left: auto; color: var(--ink); }
.hleg.one { grid-template-columns: 1fr; }
.hrs-note { margin: 6px 0 0; font-size: 11px; color: var(--faint); letter-spacing: .03em; }

/* Recently done */
.dt {
  width: 100%; min-height: var(--tap); display: flex; align-items: center; gap: 10px; padding: 0 4px;
  font-family: var(--f-meta); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
}
.dt .ok { color: var(--ok); }
.dt .n { color: var(--muted); }
.dt .hint { margin-left: auto; color: var(--faint); font-size: 10.5px; }
.dt .chev { color: var(--muted); }
.dt[aria-expanded="true"] .chev { transform: rotate(180deg); }
.dt.flash { background: var(--ok-soft); } .dt.flash .n { color: var(--ok); }
.dr { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; min-height: 48px; padding: 4px 0 4px 4px; border-top: 1px solid var(--line); }
.dr-ic { width: 20px; height: 20px; display: grid; place-items: center; color: var(--ok); border: 1px solid var(--ok-line); background: var(--ok-soft); }
.dr-ic .ico { width: 12px; height: 12px; stroke-width: 2; }
.dr-t { min-width: 0; }
.dr-title { display: block; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: line-through; text-decoration-color: var(--faint); }
.dr-sub { display: block; font-family: var(--f-meta); font-size: 10.5px; color: var(--faint); letter-spacing: .04em; }
.bring { min-height: var(--tap); padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); font-family: var(--f-meta); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.bring .ico { width: 14px; height: 14px; color: var(--muted); }
.bring:hover { background: var(--surface-2); border-color: var(--line-3); }

/* Key hints: the quiet replacement for Standing by */
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.keys span { display: inline-flex; align-items: center; gap: 5px; }
@media (max-width: 959.98px), (pointer: coarse) { .keys { display: none; } }

/* Fold-away + selection, shared by every row type */
[data-row] { position: relative; }
[data-row].is-sel { box-shadow: inset 0 0 0 1px var(--line-3); }
[data-row].is-sel::after { content: ""; position: absolute; left: -1px; top: 6px; bottom: 6px; width: 2px; background: var(--ink); pointer-events: none; }
[data-row].is-cur { background: var(--raised) !important; box-shadow: inset 3px 0 0 var(--accent); }
[data-row].is-leaving { overflow: hidden; pointer-events: none; }
[data-row].is-completing .t1 { text-decoration: line-through; text-decoration-color: var(--ok); text-decoration-thickness: 1.5px; color: var(--muted); }
[data-row].is-completing { box-shadow: inset 3px 0 0 var(--ok); }
[data-row].is-arriving { animation: arrive .5s ease-out; }

/* ============================================================
   A · Dense list + slide-in panel
   ============================================================ */
.A { padding: 0 16px; }
.a-main { max-width: 1240px; margin: 0 auto; }
.a-top { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.a-title { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.a-title .add { flex: 1; min-width: 300px; max-width: 480px; margin-left: auto; }
.a-list { container-type: inline-size; container-name: alist; padding-bottom: 12px; }
.a-sec { margin-top: 6px; }
.a-sec .secl { min-height: 26px; padding: 0 4px; }
.ar .dn { width: var(--tap); min-height: var(--rowh); }
.A .hd { padding: 8px 0 6px; }
.a-title .sub { flex: 0 1 auto; }
.a-sec .secl .srch { order: 3; flex: 0 1 240px; }
.ar { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: transparent; }
.ar:hover { background: var(--surface); }
.ar-open {
  flex: 1; min-width: 0; min-height: var(--rowh); display: grid; align-items: center; gap: 0 10px; padding: 1px 4px 1px 6px;
  grid-template-columns: 24px 18px minmax(0, 1fr) 168px 236px;
}
.ar-n { font-family: var(--f-meta); font-size: 11.5px; color: var(--faint); text-align: right; }
.ar-t { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.ar-title { font-size: 14.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 60px; }
.ar-why { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 0; }
.ar-why::before { content: "— "; color: var(--faint); }
.ar-act { display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; }
.cmd { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 10px; font-family: var(--f-meta); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cmd::after { content: "\203A"; font-size: 15px; line-height: 1; }
.cmd.go { color: var(--accent-hi); }
.cmd.go.first { background: var(--accent); color: var(--accent-ink); }
.cmd.mute { color: var(--muted); }
.is-open .cmd.go.first:not(.x) { background: transparent; color: var(--accent-hi); box-shadow: inset 0 0 0 1px var(--accent-line); }
.ar-sub { display: none; }
.ar.is-move .ar-title { color: var(--ink); }
.ar.is-first .ar-n { color: var(--accent); }
.ar.is-held { background: var(--bg-2); }
.ar.is-held::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: repeating-linear-gradient(180deg, var(--hold) 0 6px, transparent 6px 10px); }
.ar.is-held .ar-title, .ar.is-wait:not(.is-due) .ar-title { font-weight: 400; color: var(--ink); opacity: .85; }
.ar.is-rest .ar-title { font-weight: 400; }
.ar.is-rest .ar-n { color: var(--faint); }
.ar-proj { min-width: 0; }
.a-empty { padding: 10px 6px; font-size: 13px; color: var(--muted); }
.a-foot { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; padding: 8px 4px; border-top: 1px solid var(--line-2); background: var(--bg); }
.a-foot .hrs { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 280px; }
.a-foot .hrs-h .tot { margin-left: 0; font-size: 15px; }
.a-foot .hbar { flex: 1; max-width: 360px; margin: 0; }
.a-foot .hleg { display: flex; gap: 12px; margin: 0; white-space: nowrap; }
.a-foot .keys { margin-left: auto; }
.a-done { margin-top: 10px; border-top: 1px solid var(--line); }

/* Narrow list (panel open, or phone): two-line rows. */
@container alist (max-width: 820px) {
  .ar-open { grid-template-columns: 22px 18px minmax(0, 1fr); align-items: start; padding-top: 7px; padding-bottom: 7px; }
  .ar-n, .ar .sic { padding-top: 2px; }
  .ar-why, .ar-proj, .ar-act, .ar-t .flag, .ar-t .st { display: none; }
  .ar-t { flex-direction: column; align-items: stretch; gap: 2px; }
  .ar-title { white-space: nowrap; }
  .ar-sub { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
  .ar-sub .cmd { min-height: 0; padding: 0; font-size: 11px; }
  .ar-sub .cmd.first { padding: 1px 8px; }
  .ar-sub .proj { font-size: 10px; }
}

@media (min-width: 960px) {
  .A { display: grid; grid-template-columns: minmax(0, 1fr) 0px; gap: 0; padding: 0; transition: grid-template-columns .3s cubic-bezier(.4,0,.2,1); }
  .A.is-open { grid-template-columns: minmax(0, 1fr) min(620px, 52%); }
  .a-col { min-height: 0; display: flex; flex-direction: column; padding: 0 20px; }
  .a-main { width: 100%; }
  .a-col > .scroll { flex: 1; }
  .A .a-foot { margin: 0 auto; width: 100%; max-width: 1240px; }
  .A.is-open .a-col .ar:not(.is-cur), .A.is-open .a-col .a-top { opacity: .62; }
  .A.is-open .a-col:hover .ar, .A.is-open .a-col:hover .a-top { opacity: 1; }
  .A.is-open .a-title .add { display: none; }
  .a-panel { min-width: 0; min-height: 0; overflow: hidden; display: flex; }
  .a-panel > .iv { width: min(620px, 52vw); flex: none; margin: 12px 16px 12px 0; }

.c-over { container-type: inline-size; container-name: cover; }

.cr { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.cr:hover { background: var(--surface); }

.cr-t { display: flex; flex-direction: column; min-width: 0; }

.c-wk { padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); }

  .c-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

}
.c-item { display: none; }
@media (min-width: 960px) {
  .C { display: grid; grid-template-columns: minmax(400px, 0.9fr) 1px minmax(0, 1.1fr); gap: 0 22px; height: 100%; padding: 0 20px; }

}

/* ============================================================
   Item view (shared by A, B, C)
   ============================================================ */
.iv { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--raised); border: 1px solid var(--line-3); box-shadow: 0 30px 70px -30px rgba(0,0,0,.85); }

.iv-nav .ico, .btn-close .ico { width: 16px; height: 16px; }
.iv-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 18px; scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
.iv-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-meta); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.iv-sec { margin: 20px 0 8px; font-family: var(--f-meta); font-size: 10.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: .1em; }
.iv-sec::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.card { background: var(--surface); border: 1px solid var(--line-2); padding: 12px 14px; }
.m-from { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
.m-from b { color: var(--ink); font-weight: 500; }

.m-body { margin: 0; font-size: 14px; opacity: .88; }
.draft { position: relative; border-color: var(--line-3); }
.draft::before, .draft::after { content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; }
.draft::before { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
.draft::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
.iv.is-hold .draft::before, .iv.is-hold .draft::after { border-color: var(--hold-line); }
.draft-row { display: flex; gap: 10px; align-items: center; font-size: 13.5px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.draft-row .k { color: var(--muted); font-family: var(--f-meta); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; }

.draft textarea { display: block; width: 100%; margin-top: 10px; min-height: 120px; resize: vertical; padding: 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 0; font-size: 14.5px; line-height: 1.55; }

.qbtn { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; font-family: var(--f-meta); font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

.iv-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }

/* Phone: the item is its own screen. */
@media (max-width: 959.98px) {
  .a-panel, .b-drawer, .c-item {

.btn-ask { min-height: 46px; padding: 0 22px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }

  background: var(--bar); border: 1px solid var(--line-3); border-left: 3px solid var(--ok); font-size: 14px; line-height: 1.35; box-shadow: 0 10px 40px rgba(0,0,0,.5);

  /* ---------------- Render ---------------- */
  var stage = document.getElementById('stage');
  function saveScroll() {
    var m = {};
    stage.querySelectorAll('[data-scroll]').forEach(function (el) { m[el.getAttribute('data-scroll')] = el.scrollTop; });
    m.win = window.scrollY; return m;
  }
  function render(keep) {

      stage.querySelectorAll('[data-scroll]').forEach(function (el) { var v = sc[el.getAttribute('data-scroll')]; if (v) el.scrollTop = v; });
      if (sc.win) window.scrollTo(0, sc.win);

  }
  function phone() { return window.matchMedia('(max-width: 959.98px)').matches; }
  function applySearch() {
    var q = S.q.trim().toLowerCase();
    stage.querySelectorAll('[data-row]').forEach(function (el) {
      var f = find(el.getAttribute('data-id'));
      el.hidden = !!(q && f && f.group === 'rest' && el.getAttribute('data-q').indexOf(q) < 0);
    });
  }
  function markRows() {
    stage.querySelectorAll('[data-row]').forEach(function (el) {

      el.classList.toggle('is-sel', S.sel === id);
    });
  }
  function openItem(id) {
    if (!find(id)) return;
    var was = S.open;
    S.open = id; S.sel = id;
    var root = document.getElementById('dirRoot'), panel = document.getElementById('panel');
    panel.innerHTML = ivHTML();
    root.classList.add('is-open');
    document.documentElement.classList.toggle('lock', phone());
    markRows();
    if (!was || phone()) { var c = panel.querySelector('.btn-close'); if (c) setTimeout(function () { c.focus({ preventScroll: true }); }, 30); }
  }
  function closeItem() {
    if (!S.open) return;
    var id = S.open; S.open = null;
    var root = document.getElementById('dirRoot');
    root.classList.remove('is-open');
    document.documentElement.classList.remove('lock');
    markRows();
    setTimeout(function () { if (!S.open) { var p = document.getElementById('panel'); if (p) p.innerHTML = ''; } }, 320);
    var row = stage.querySelector('[data-row][data-id="' + id + '"] [data-open]');
    if (row) row.focus({ preventScroll: true });
  }
  function rows() { return Array.prototype.filter.call(stage.querySelectorAll('[data-row]'), function (el) { return !el.hidden && el.offsetParent !== null; }); }
  function step(d) {
    var list = rows(); if (!list.length) return;
    var i = list.findIndex(function (el) { return el.getAttribute('data-id') === (S.open || S.sel); });
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : Math.max(0, Math.min(list.length - 1, i + d));
    var el = list[i]; S.sel = el.getAttribute('data-id');
    el.scrollIntoView({ block: 'nearest' });
    if (S.open) openItem(S.sel); else markRows();
    var b = el.querySelector('[data-open]'); if (b && !S.open) b.focus({ preventScroll: true });

  /* ---------------- Done: fold away, tally, Recently done, Undo ---------------- */
  function complete(id, how) {
    var f = find(id); if (!f) return;
    if (S.open === id) closeItem();
    var els = stage.querySelectorAll('[data-row][data-id="' + id + '"]');
    els.forEach(function (el) { el.classList.add('is-completing'); });
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () {
      els.forEach(function (el) {
        el.style.height = el.offsetHeight + 'px'; el.classList.add('is-leaving');
        void el.offsetHeight;
        el.style.height = '0px'; el.style.minHeight = '0px'; el.style.opacity = '0'; el.style.marginTop = '0'; el.style.marginBottom = '0'; el.style.paddingTop = '0'; el.style.paddingBottom = '0'; el.style.borderWidth = '0';
      });
      setTimeout(function () {
        D[f.group].splice(D[f.group].indexOf(f.it), 1);
        D.recent.unshift({ id: f.it.id, src: f.it.src, proj: f.it.proj, title: f.it.title, at: 'Mon 10:0' + (S.seq++ % 10), how: how || 'Marked done', back: f });
        D.doneToday++; S.bump = true; S.flashDone = true;
        if (S.sel === id) S.sel = null;
        S.undo = f;
        render(true);
        toast('Done · <q>' + esc(f.it.title) + '</q>', true);
        setTimeout(function () { S.bump = false; S.flashDone = false; var t = stage.querySelector('.tally'); if (t) t.classList.remove('bump'); var d = stage.querySelector('.dt'); if (d) d.classList.remove('flash'); }, 1400);

  function restore(rec) {
    var f = rec;

  function bring(id) {

  function toast(html, undo) {

  /* ---------------- Ask Claude sheet ---------------- */
  var lastFocus = null;
  function openAsk(ctx) {

  function closeAsk() { document.getElementById('sheetHost').innerHTML = ''; if (lastFocus) lastFocus.focus({ preventScroll: true }); }

  /* ---------------- Events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a, [data-close], [data-sheet-close]'); if (!t) return;
    if (t.hasAttribute('data-dir')) { S.dir = t.getAttribute('data-dir'); S.open = null; S.sel = null; try { history.replaceState(null, '', '#' + S.dir); } catch (x) {} render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-done')) { e.stopPropagation(); return complete(t.getAttribute('data-done'), t.textContent.indexOf('Not waiting') >= 0 ? 'No longer waiting' : 'Marked done'); }
    if (t.hasAttribute('data-send')) {
      var sid = t.getAttribute('data-send'), sf = find(sid);
      if (sf && sf.it.st === 'wait' && !sf.it.due) { toast('Chase copied for Teams · <q>' + esc(sf.it.title) + '</q>'); return; }
      return complete(sid, sf && sf.it.st === 'held' ? 'Closed' : 'Sent');
    }
    if (t.hasAttribute('data-open')) { var id = t.getAttribute('data-open'); if (S.open === id && !phone()) return closeItem(); return openItem(id); }
    if (t.hasAttribute('data-close')) return closeItem();
    if (t.hasAttribute('data-step')) return step(+t.getAttribute('data-step'));

    if (t.hasAttribute('data-ask')) return openAsk();
    if (t.hasAttribute('data-sheet-close')) return closeAsk();
    if (t.hasAttribute('data-chip')) { document.getElementById('askIn').value = t.textContent; return; }
    if (t.hasAttribute('data-ask-go')) { document.getElementById('askOut').innerHTML = '<p class="ask-reply">Claude drafts it here as a card with its own Send. Nothing goes out without your click.</p>'; return; }
    if (t.hasAttribute('data-done-toggle')) { S.doneOpen = !S.doneOpen; render(true); var dt = stage.querySelector('[data-done-toggle]'); if (dt) dt.focus({ preventScroll: true }); return; }
    if (t.hasAttribute('data-bring')) return bring(t.getAttribute('data-bring'));
    if (t.hasAttribute('data-undo')) { if (S.undo) { var u = S.undo; S.undo = null; document.getElementById('toastHost').innerHTML = ''; restore(u); } return; }
    if (t.tagName === 'A' && t.getAttribute('href').charAt(0) === '#') {

    }

  document.addEventListener('submit', function (e) {
    var f = e.target.closest('[data-add]'); if (!f) return;

    var v = f.querySelector('input').value.trim(); if (!v) return;
    var it = { id: 'mine-' + (++S.seq), st: 'move', src: 'mine', proj: 'My action', flag: 'Pinned', title: v,
      why: 'Your own action. It stays in Today until done or Not today.', act: 'Open', send: 'Mark done',
      from: 'You', when: 'Mon 10:00', subj: v, body: 'No notes yet.', kind: 'Note', to: 'Only you', draft: '' };
    D.today.push(it); S.arriving = it.id; render(true); S.arriving = null;
    var inp = stage.querySelector('[data-add] input'); if (inp) inp.focus();
    toast('Added to Today · <q>' + esc(v) + '</q>');
  });
  document.addEventListener('input', function (e) {
    if (e.target.matches('[data-search]')) { S.q = e.target.value; applySearch(); }
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea';
    if (e.key === 'Escape') {
      if (document.getElementById('sheetHost').innerHTML) { e.preventDefault(); return closeAsk(); }
      if (typing) { e.target.blur(); return; }
      if (S.open) { e.preventDefault(); return closeItem(); }
      if (S.sel) { S.sel = null; markRows(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey || document.getElementById('sheetHost').innerHTML) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); return step(e.key === 'ArrowDown' ? 1 : -1); }
    if (e.key === 'Enter' && S.sel && !S.open) {
      if (e.target.closest && e.target.closest('button:not([data-open])')) return;
      e.preventDefault(); return openItem(S.sel);
    }
    if (e.key === 'a') { var a = stage.querySelector('[data-add] input'); if (a && a.offsetParent) { e.preventDefault(); a.focus(); } return; }
    if (e.key === 'k') { e.preventDefault(); return openAsk(); }
    if (e.key === '1' || e.key === '2' || e.key === '3') { var d = { 1: 'a', 2: 'b', 3: 'c' }[e.key]; document.querySelector('.mk-tab[data-dir="' + d + '"]').click(); }
  });
  window.addEventListener('resize', function () { document.documentElement.classList.toggle('lock', !!S.open && phone()); });

  var h = (location.hash || '').slice(1);
  if (h === 'a' || h === 'b' || h === 'c') S.dir = h;
  render();
  window.Layouts = { S: S, D: D, openItem: openItem, closeItem: closeItem };
})();
</script>
