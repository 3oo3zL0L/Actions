<title>Droplet Directions</title>
<style>
/* ============================================================
   Droplet: three visual directions (A Ma, B Dark Forest, C Lambda)
   One DOM, one script. Each direction = its own token set + skin.
   ============================================================ */

/* ---------- Tokens: A "Ma" (also the default) ---------- */
:root,
:root[data-dir="A"] {
  color-scheme: dark;
  --bg: #11100e;
  --bg-2: #161512;
  --surface: #191814;
  --surface-2: #1f1d19;
  --ink: #ece6da;
  --muted: #a39c8e;
  --faint: #5c574e;
  --line: #2b2823;
  --line-2: #3a362f;
  --accent: #ff8a1f;
  --accent-hi: #ffa24d;
  --accent-ink: #1b0f03;
  --accent-soft: rgba(255, 138, 31, 0.10);
  --accent-line: rgba(255, 138, 31, 0.55);
  --focus: #ffb36b;
  --ok: #c9c1ae;
  --f-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif", Georgia, serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-meta: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --r: 3px;
  --r-lg: 4px;
  --r-btn: 3px;
}

/* ---------- Tokens: B "Dark Forest" ---------- */
:root[data-dir="B"] {
  --bg: #04060c;
  --bg-2: #070a14;
  --surface: rgba(13, 19, 34, 0.62);
  --surface-2: rgba(19, 27, 46, 0.72);
  --ink: #e3e8f4;
  --muted: #8f9ab3;
  --faint: #3e4862;
  --line: #18213a;
  --line-2: #24304f;
  --accent: #ff8a1f;
  --accent-hi: #ffa64f;
  --accent-ink: #160a01;
  --accent-soft: rgba(255, 138, 31, 0.12);
  --accent-line: rgba(255, 138, 31, 0.5);
  --focus: #ffb36b;
  --ok: #b9c4dc;
  --f-display: "Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-meta: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --r: 16px;
  --r-lg: 22px;
  --r-btn: 999px;
}

/* ---------- Tokens: C "Lambda" ---------- */
:root[data-dir="C"] {
  --bg: #0e1013;
  --bg-2: #121519;
  --surface: #15181c;
  --surface-2: #1a1e23;
  --ink: #e9e6df;
  --muted: #9ba1a8;
  --faint: #4c535b;
  --line: #262b31;
  --line-2: #343a42;
  --accent: #ff8a1f;
  --accent-hi: #ff9d3f;
  --accent-ink: #140a01;
  --accent-soft: rgba(255, 138, 31, 0.10);
  --accent-line: rgba(255, 138, 31, 0.6);
  --focus: #ffb36b;
  --ok: #9fd7a5;
  --f-display: "Chakra Petch", "Bahnschrift", "DIN Alternate", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-meta: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 0px;
  --r-lg: 0px;
  --r-btn: 0px;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; flex: none; }
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 15px; height: 15px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-btn); }
[hidden] { display: none !important; }

/* ---------- Background layer ---------- */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sky > * { position: absolute; inset: 0; width: 100%; height: 100%; }
:root[data-dir="A"] .sky {
  background:
    radial-gradient(120% 60% at 0% 0%, rgba(236, 230, 218, 0.035), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(255, 138, 31, 0.025), transparent 70%);
}
:root[data-dir="B"] .sky {
  background:
    radial-gradient(140% 80% at 85% -10%, rgba(40, 62, 120, 0.22), transparent 55%),
    radial-gradient(100% 60% at 0% 110%, rgba(255, 138, 31, 0.05), transparent 60%);
}
:root[data-dir="C"] .sky {
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-mask-image: linear-gradient(to bottom, #000, transparent 85%);
  mask-image: linear-gradient(to bottom, #000, transparent 85%);
}
.stars { opacity: 0; }
:root[data-dir="B"] .stars { opacity: 1; }
.horizon { opacity: 0; }
:root[data-dir="B"] .horizon { opacity: 1; }

/* ---------- Direction switcher (mockup chrome) ---------- */
.dirbar { max-width: 1180px; margin: 0 auto; padding: 10px 16px 4px; }
.dirbar-row { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.dirbar-label { font-family: var(--f-meta); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.dirtabs { display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: calc(var(--r-btn) + 2px); background: var(--bg-2); max-width: 100%; }
.dirtab {
  min-height: 44px; padding: 0 12px; border-radius: var(--r-btn);
  font-family: var(--f-meta); font-size: 13px; color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.dirtab b { font-weight: 500; color: var(--faint); }
.dirtab:hover { color: var(--ink); }
.dirtab[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent-line); }
.dirtab[aria-pressed="true"] b { color: var(--accent); }
.rationale { margin: 6px 0 0; font-size: 13px; color: var(--muted); max-width: 70ch; }
.rationale strong { color: var(--ink); font-weight: 500; }

/* ---------- App layout ---------- */
.app { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.list-col { display: flex; flex-direction: column; min-height: calc(100vh - 96px); min-height: calc(100dvh - 96px); }
.list-main { flex: 1; }
.item-col { display: flex; flex-direction: column; min-height: calc(100vh - 96px); min-height: calc(100dvh - 96px); }
@media (max-width: 959.98px) {
  .app[data-view="item"] .list-col { display: none; }
  .app[data-view="list"] .item-col { display: none; }
}
@media (min-width: 960px) {
  /* Laptop: app-like frame. Switcher on top, list scrolls on the left, item panel on the right. */
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .dirbar { width: 100%; flex: none; }
  .app { flex: 1; min-height: 0; width: 100%; display: grid; grid-template-columns: minmax(400px, 470px) minmax(0, 1fr); gap: 48px; align-items: stretch; }
  .list-col { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 8px; margin-right: -8px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .item-col {
    margin: 18px 0 20px; min-height: 0;
    border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg-2); overflow: hidden;
  }
  .iv-scroll { overflow-y: auto; overscroll-behavior: contain; }
  .iv-head .back-label-phone { display: none; }
}

/* ---------- List header ---------- */
.lh { position: relative; padding: 28px 0 12px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.brand .drop { width: 18px; height: 18px; color: var(--accent); }
.brand-name { letter-spacing: 0.02em; }
.status { display: none; }
.date { margin: 28px 0 4px; font-family: var(--f-meta); font-size: 13px; color: var(--muted); }
.h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: 1.1; letter-spacing: -0.01em; }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.enso { display: none; }

/* ---------- Focus list ---------- */
.focus { list-style: none; margin: 16px 0 0; padding: 0; }
.fi { position: relative; }
.fi-open {
  display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 0 12px; width: 100%;
  text-align: left; padding: 0; border-radius: var(--r);
}
.fi-rank { display: flex; align-items: flex-start; justify-content: flex-start; padding-top: 2px; }
.fi-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fi-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-meta); font-size: 12.5px; color: var(--muted); }
.src { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); opacity: 0.85; }
.src .ico { width: 15px; height: 15px; }
.sep { color: var(--faint); }
.flag { color: var(--accent-hi); }
.fi-title { font-size: 18px; line-height: 1.3; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.fi-why { display: flex; gap: 7px; align-items: flex-start; font-size: 14.5px; color: var(--muted); line-height: 1.45; }
.fi-why .ico { width: 14px; height: 14px; margin-top: 3px; color: var(--accent); opacity: 0.9; }
.fi-act { padding-left: 56px; margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn-act {
  min-height: 44px; padding: 0 16px; border-radius: var(--r-btn);
  display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500;
  color: var(--accent-hi); background: transparent; box-shadow: inset 0 0 0 1px var(--accent-line);
  text-align: left; max-width: 100%;
}
.btn-act:hover { background: var(--accent-soft); }
.fi.is-first .btn-act { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.fi.is-first .btn-act:hover { background: var(--accent-hi); }
.state-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-family: var(--f-meta); font-size: 13.5px; color: var(--ok); }
.state-chip .ico { color: var(--accent); }
.fi.is-closed .fi-title, .fi.is-closed .fi-why { opacity: 0.5; }
.fi.is-current .fi-open { box-shadow: none; }
.allclear { padding: 28px 0; color: var(--muted); }

/* ---------- Everything else ---------- */
.rest { margin: 28px 0 8px; }
.rest-toggle {
  width: 100%; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 4px; color: var(--ink); border-top: 1px solid var(--line); border-radius: 0;
}
.rest-toggle .count { color: var(--muted); font-family: var(--f-meta); font-size: 13px; margin-left: 8px; }
.rest-toggle .chev { transition: none; color: var(--muted); }
.rest-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.search { position: relative; margin: 4px 0 8px; }
.search .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%; min-height: 46px; padding: 0 14px 0 42px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 16px;
}
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.rest-list { list-style: none; margin: 0; padding: 0; }
.rr {
  width: 100%; min-height: 56px; display: grid; grid-template-columns: 26px 20px minmax(0, 1fr); align-items: center; gap: 10px;
  padding: 8px 4px; text-align: left; border-bottom: 1px solid var(--line); border-radius: 0;
}
.rr:hover { background: var(--accent-soft); }
.rr-n { font-family: var(--f-meta); font-size: 12px; color: var(--faint); text-align: right; }
.rr-t { display: flex; flex-direction: column; min-width: 0; }
.rr-title { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-sub { font-size: 12.5px; color: var(--muted); font-family: var(--f-meta); }
.rr .ico { color: var(--muted); }
.rr.is-closed .rr-title { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted); }
.rest-empty { padding: 16px 4px; color: var(--muted); font-size: 14px; }

/* ---------- Ask Claude (global) ---------- */
.askbar-wrap { position: sticky; bottom: 0; z-index: 5; padding: 10px 0 calc(12px + env(safe-area-inset-bottom)); background: var(--bg); }
.askbar-wrap::before { content: ""; position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
.askbar {
  width: 100%; min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
  border-radius: var(--r-btn); background: var(--surface-2); border: 1px solid var(--line-2); color: var(--muted); text-align: left;
}
.askbar .ico { color: var(--accent); }
.askbar .lbl { color: var(--ink); font-weight: 500; white-space: nowrap; flex: none; }
.askbar .hint { margin-left: auto; min-width: 0; font-size: 13px; color: var(--faint); font-family: var(--f-meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.askbar:hover { border-color: var(--accent-line); }

/* ---------- Item view ---------- */
.iv-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.btn-back { min-height: 44px; min-width: 44px; padding: 0 12px 0 6px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); border-radius: var(--r-btn); }
.btn-back:hover { background: var(--accent-soft); }
.iv-crumb { font-family: var(--f-meta); font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.iv-scroll { flex: 1; padding-bottom: 12px; }
.iv-title { margin: 6px 0 0; font-family: var(--f-display); font-weight: 500; font-size: 26px; line-height: 1.2; overflow-wrap: anywhere; }
.iv-why { margin: 14px 0 0; display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; color: var(--ink); }
.iv-why .who { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.iv-why .who .ico { width: 15px; height: 15px; }
.iv-why p { margin: 3px 0 0; }
.sec-label { margin: 28px 0 10px; font-family: var(--f-meta); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sec-label .ico { width: 14px; height: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.mail-from { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; color: var(--muted); }
.mail-from b { color: var(--ink); font-weight: 500; }
.mail-subj { margin: 6px 0 10px; font-weight: 500; font-size: 15.5px; overflow-wrap: anywhere; }
.mail-body p { margin: 0 0 10px; font-size: 15px; color: var(--ink); opacity: 0.88; overflow-wrap: anywhere; }
.mail-body p:last-child { margin-bottom: 0; }
.thread { display: flex; flex-direction: column; gap: 12px; }
.msg { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line-2); }
.msg.me .av { color: var(--accent); }
.msg-h { font-size: 13px; color: var(--muted); }
.msg-h b { color: var(--ink); font-weight: 500; margin-right: 6px; }
.msg-t { font-size: 15px; overflow-wrap: anywhere; }
.msg.hl .msg-t { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); padding: 4px 8px; margin-left: -8px; border-radius: 0 var(--r) var(--r) 0; }
.src-note { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line-2); font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.draft { border-color: var(--line-2); }
.draft-row { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 34px; font-size: 14px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.draft-row .k { color: var(--muted); font-family: var(--f-meta); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13.5px; }
:root[data-dir="C"] .chip { border-radius: 0; }
.draft textarea {
  display: block; width: 100%; margin-top: 12px; min-height: 150px; resize: vertical; padding: 12px;
  background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r); color: var(--ink);
  font-size: 15.5px; line-height: 1.55; font-family: var(--f-body);
}
.draft textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.draft.is-editing textarea { border-color: var(--accent-line); }
.draft.is-locked textarea { opacity: 0.6; resize: none; }
.warn { margin-top: 10px; display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--accent-hi); }
.draft-foot { margin-top: 10px; font-size: 12.5px; color: var(--muted); font-family: var(--f-meta); }

/* chat about this */
.chat { margin-top: 14px; }
.chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
.cm { max-width: 92%; font-size: 14.5px; padding: 10px 12px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); }
.cm.u { align-self: flex-end; background: var(--surface-2); }
.cm.c { display: flex; gap: 8px; }
.cm.c .ico { color: var(--accent); margin-top: 3px; width: 14px; height: 14px; }
.chat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chat-chip { min-height: 44px; padding: 0 14px; border-radius: var(--r-btn); border: 1px solid var(--line-2); color: var(--ink); font-size: 14px; }
.chat-chip:hover { border-color: var(--accent-line); }
.chat-form { display: flex; gap: 8px; }
.chat-form input { flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); font-size: 16px; }
.icon-btn { min-width: 46px; min-height: 46px; display: grid; place-items: center; border-radius: var(--r-btn); border: 1px solid var(--line-2); color: var(--accent); }

/* action bar */
.iv-bar {
  position: sticky; bottom: 0; z-index: 5;
  padding: 6px 0 calc(12px + env(safe-area-inset-bottom));
  background: var(--bg);
}
.iv-bar::before { content: ""; position: absolute; left: 0; right: 0; top: -28px; height: 28px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
.quiet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 8px; }
.qbtn {
  min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 12px; color: var(--muted); border-radius: var(--r); padding: 4px 2px; text-align: center; line-height: 1.2;
}
.qbtn:hover { color: var(--ink); background: var(--accent-soft); }
.qbtn[aria-pressed="true"] { color: var(--accent-hi); }
.qbtn[aria-disabled="true"] { opacity: 0.35; cursor: default; }
.btn-send {
  width: 100%; min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px;
  border-radius: var(--r-btn); background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600;
}
.btn-send:hover { background: var(--accent-hi); }
.btn-send.is-sent { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); cursor: default; font-weight: 500; }
.btn-send.is-sent .ico { color: var(--accent); }
.sent-note { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; font-family: var(--f-meta); }
@media (min-width: 960px) {
  .iv-head { padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .iv-scroll { padding: 8px 28px 24px; }
  .iv-bar::before { display: none; }
  .iv-bar { padding: 12px 20px; background: var(--bg-2); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .quiet { display: flex; gap: 2px; margin: 0; flex: 1; }
  .quiet { flex-wrap: wrap; }
  .qbtn { flex-direction: row; gap: 7px; padding: 0 10px; font-size: 13.5px; min-height: 46px; white-space: nowrap; flex: none; }
  .btn-send { width: auto; min-width: 180px; padding: 0 28px; margin-left: auto; }
  .sent-note { width: 100%; text-align: right; margin: 0; }
}

/* empty panel (laptop) */
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 40px; color: var(--muted); }
.empty h2 { margin: 18px 0 6px; font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--ink); }
.empty p { margin: 0; font-size: 14px; }

      return '<button class="qbtn" data-' + key + (locked ? ' aria-disabled="true"' : '') + (pressed !== undefined ? ' aria-pressed="' + pressed + '"' : '') + '>' + ico(icon) + '<span>' + label + '</span></button>';
    };
    return '<div class="quiet">' + q('edit', 'edit', 'Edit', S.editing) + q('chat', 'chat', 'Chat about this', S.chatOpen) + q('notimp', 'down', 'Not important') + q('done', 'check', 'Done') + '</div>' +
      (locked
        ? '<button class="btn-send is-sent" id="sendBtn" aria-disabled="true">' + ico('check') + 'Sent ✓ ' + st.sent + '</button>'
        : '<button class="btn-send" id="sendBtn" data-send>' + ico('send') + 'Send</button>') +
      (locked ? '<div class="sent-note">Marked done · sent once</div>' : '');
  }

  function renderAll() {
    root.setAttribute('data-dir', S.dir);
    $('app').setAttribute('data-view', S.view);
    renderDirbar(); renderHeader(); renderFocus(); renderRest(); renderItem();
  }

  /* ---------------- Toast ---------------- */
  function toast(msg, undo) {
    clearTimeout(S.toastTimer);
    $('toastHost').innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (undo ? '<button data-undo>Undo</button>' : '') + '</div>';
    S.undo = undo || null;
    S.toastTimer = setTimeout(function () { $('toastHost').innerHTML = ''; S.undo = null; }, 6000);
  }

  /* ---------------- Ask Claude sheet ---------------- */
  var askReturn = null;
  function openAsk() {
    askReturn = document.activeElement;
    $('sheetHost').innerHTML = '<div class="scrim" data-ask-close></div>' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="askTitle">' +
        '<div class="sheet-h"><h2 id="askTitle">' + ico('spark') + 'Ask Claude</h2><button class="icon-btn" data-ask-close aria-label="Close">' + ico('close') + '</button></div>' +
        '<form data-askform><label class="sr" for="askIn">Your question</label><textarea id="askIn" placeholder="Update the DoD page with Tuesday’s decisions…"></textarea>' +
        '<div class="chat-chips"><button type="button" class="chat-chip" data-askchip="Update a Confluence page: ">Update a Confluence page</button><button type="button" class="chat-chip" data-askchip="Mail a customer: ">Mail a customer</button></div>' +
        '<div class="sheet-foot"><small>Nothing is sent or changed without your click.</small><button class="btn-ask" type="submit">Ask</button></div></form>' +
        '<div class="ask-reply" id="askReply"></div>' +
      '</div>';
    $('askIn').focus();
  }
  function closeAsk() { $('sheetHost').innerHTML = ''; if (askReturn && askReturn.focus) askReturn.focus(); }

  /* ---------------- Navigation ---------------- */
  function openItem(id, focusDraft) {
    if (S.view === 'list') S.scrollY = window.scrollY;
    S.cur = id; S.view = 'item'; S.anim = true; S.editing = !!focusDraft; S.chatOpen = false;
    renderAll();
    if (window.innerWidth < 960) window.scrollTo(0, 0);
    var t = focusDraft ? $('draftText') : $('ivTitle');
    if (t) t.focus({ preventScroll: window.innerWidth >= 960 });
  }
  function back() {
    var prev = S.cur;
    S.view = 'list'; S.cur = null; S.editing = false; S.chatOpen = false;
    renderAll();
    if (window.innerWidth < 960) window.scrollTo(0, S.scrollY || 0);
    var el = document.querySelector('[data-open="' + prev + '"]');
    if (el) el.focus({ preventScroll: true });
  }
  function setDir(k) {
    if (!DIRS[k]) return;
    S.dir = k; renderAll();
    try { history.replaceState(null, '', '#' + k); } catch (e) { /* sandboxed */ }
  }

  /* ---------------- Events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, [data-ask-close]');
    if (!t) return;
    var id;
    if (t.hasAttribute('data-dir')) return setDir(t.getAttribute('data-dir'));
    if ((id = t.getAttribute('data-open'))) return openItem(id, false);
    if ((id = t.getAttribute('data-act'))) return openItem(id, true);
    if (t.id === 'restToggle') { S.restOpen = !S.restOpen; renderRest(); if (S.restOpen) $('q').focus(); return; }
    if (t.hasAttribute('data-back')) return back();
    if (t.hasAttribute('data-ask')) return openAsk();
    if (t.hasAttribute('data-ask-close')) return closeAsk();
    if (t.hasAttribute('data-askchip')) { var a = $('askIn'); a.value = t.getAttribute('data-askchip'); a.focus(); return; }
    if (t.hasAttribute('data-undo')) { if (S.undo) S.undo(); $('toastHost').innerHTML = ''; return; }
    if (t.getAttribute('aria-disabled') === 'true') return;
    var cur = S.cur;
    if (t.hasAttribute('data-send') && cur && !status(cur).sent) {
      S.st[cur] = { sent: '10:42' }; S.editing = false; S.chatOpen = false;
      renderFocus(); renderRest(); renderItem();
      var b = $('sendBtn'); if (b) b.focus();
      return;
    }
    if (t.hasAttribute('data-edit') && cur) {
      S.editing = !S.editing; renderItem();
      var ta = $('draftText');
      if (S.editing && ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      else { var eb = document.querySelector('[data-edit]'); if (eb) eb.focus(); }
      return;
    }
    if (t.hasAttribute('data-chat') && cur) {
      S.chatOpen = !S.chatOpen; renderItem();
      if (S.chatOpen) { var ci = $('chatIn'); if (ci) { ci.focus({ preventScroll: true }); ci.scrollIntoView({ block: 'center' }); } }
      return;
    }
    if (t.hasAttribute('data-chip') && cur) return chatSay(cur, t.getAttribute('data-chip'));
    if (t.hasAttribute('data-notimp') && cur) {
      S.st[cur] = { ni: true };
      back();
      toast('Moved to Everything else. I’ll rank it lower next time.', function () { delete S.st[cur]; renderFocus(); renderRest(); });
      return;
    }
    if (t.hasAttribute('data-done') && cur) {
      S.st[cur] = { done: true }; back();
      toast('Marked done.', function () { delete S.st[cur]; renderFocus(); renderRest(); });
      return;
    }
  });

  function chatSay(id, text) {
    var log = S.chat[id] = S.chat[id] || [];
    log.push({ u: true, t: text });
    var d = S.drafts[id], reply = 'Updated the draft. Check it before you send.';
    var lc = text.toLowerCase();
    if (lc.indexOf('short') > -1) { S.drafts[id] = d.split('\n\n')[0].replace(/^(Hi [^,\n]+,)\s*$/, '$1') ; if (S.drafts[id].length < 25) S.drafts[id] = d.split('\n\n').slice(0, 2).join('\n\n'); reply = 'Shortened it to the essentials.'; }
    else if (lc.indexOf('direct') > -1) { S.drafts[id] = d.replace(/a gentle nudge on/i, 'following up on').replace(/Happy to pair for 15 minutes on it\./, 'I need an answer by Tuesday.'); reply = 'Made it more direct and kept it polite.'; }
    else if (lc.indexOf('deadline') > -1) { S.drafts[id] = d + '\n\nPlease reply by Tuesday 6 Oct.'; reply = 'Added a deadline: Tuesday 6 Oct.'; }
    log.push({ u: false, t: reply });
    renderItem();
    var ci = $('chatIn'); if (ci) ci.focus({ preventScroll: true });
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    if (e.target.hasAttribute('data-chatform')) {
      var v = $('chatIn').value.trim(); if (v && S.cur) chatSay(S.cur, v);
    }
    if (e.target.hasAttribute('data-askform')) {
      var q = $('askIn').value.trim();
      $('askReply').innerHTML = q ? '<div class="cm c">' + ico('spark') + '<span>In Droplet I’d prepare this as a draft card and show it to you first. Nothing changes until you press Send.</span></div>' : '';
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { S.q = e.target.value; renderRest(); }
    if (e.target.id === 'draftText' && S.cur) S.drafts[S.cur] = e.target.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if ($('sheetHost').innerHTML) return closeAsk();
    if (S.view === 'item') back();
  });

  /* ---------------- Boot ---------------- */
  var h = (location.hash || '').replace('#', '').toUpperCase();
  if (DIRS[h]) S.dir = h;
  renderAll();
})();
</script>
