# Eén kleine server is genoeg. Vul het IP-adres en de hostnaam in en draai: bin/kamal setup
service: actielijst
image: actielijst

servers:
  web:
    - 192.168.0.1

proxy:
  ssl: true
  host: actielijst.example.com

# Kamal bouwt lokaal en zet het image in een registry op de server zelf, geen Docker Hub nodig.
registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
    - ANTHROPIC_API_KEY
  clear:
    # Solid Queue draait in Puma, dus geen aparte worker.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite-databases en uploads blijven bewaard tussen deploys.
volumes:
  - "actielijst_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64
